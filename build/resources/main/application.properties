# ==========================================================
# DevOpsPulse - Application Configuration
# ==========================================================

spring.application.name=DevOpsPulse
server.port=8081

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Actuator - expose health, info, and metrics endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# Application info
info.app.name=DevOpsPulse
info.app.version=1.0.0
info.app.description=BUILD. DEPLOY. MONITOR.

# Logging
logging.level.root=INFO
logging.level.com.devopspulse=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
